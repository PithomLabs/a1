components:
  parameters:
    EmployerId:
      name: employer_id
      in: path
      required: true
      schema:
        type: string
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    Error:
      type: object
      required: [error, message, request_id]
      properties:
        error:
          type: string
          example: unsupported
        message:
          type: string
          example: Unsupported employment case
        request_id:
          type: string
          format: uuid
    Paginated:
      type: object
      required: [data, page, page_size, total]
      properties:
        data:
          type: array
          items:
            type: object
        page:
          type: integer
          minimum: 1
          example: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 200
          example: 50
        total:
          type: integer
          minimum: 0
