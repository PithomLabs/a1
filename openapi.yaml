openapi: 3.0.3
info:
  title: WorkforceOps Lab API
  version: 0.1.0
  description: |
    Single-application contract for the v0.1 integrated HR/WFM/payroll
    backend. All resources are employer-scoped; rule packs are
    jurisdiction-global and read-only. Every path carries x-maturity:
    draft paths are the frozen contract for their slice and MUST NOT be
    served until implemented. Serves on loopback only (127.0.0.1:8081);
    there is no authentication in v0.1. Every employer-scoped path may
    return 403 employer_context_rejected outside the configured context.
servers:
  - url: http://127.0.0.1:8081
    description: workforceops serve (loopback only)
paths:
  /healthz:
    get:
      x-maturity: implemented
      summary: Liveness probe (no dependencies)
      operationId: healthz
      responses:
        '200':
          description: Process alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /readyz:
    get:
      x-maturity: implemented
      summary: Readiness probe (includes database reachability)
      operationId: readyz
      responses:
        '200':
          description: Ready to serve
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/employers:
    post:
      x-maturity: implemented
      summary: Bootstrap the v0.1 employer (no employer context needed)
      operationId: createEmployer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, uen, address, jurisdiction]
      responses:
        '201':
          description: Employer created
          content:
            application/json:
              schema:
                type: object
        '200':
          description: Employer already configured (safe repeat, existed=true)
          content:
            application/json:
              schema:
                type: object
  /api/v1/employers/{employer_id}:
    get:
      x-maturity: implemented
      summary: Show one employer record
      operationId: showEmployer
      parameters:
        - $ref: '#/components/parameters/EmployerId'
      responses:
        '200':
          description: Employer
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Outside configured employer context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/employers/{employer_id}/employees:
    get:
      x-maturity: implemented
      summary: List employees
      operationId: listEmployees
      parameters:
        - $ref: '#/components/parameters/EmployerId'
      responses:
        '200':
          description: Employees
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      x-maturity: implemented
      summary: Create an employee with initial terms
      operationId: createEmployee
      parameters:
        - $ref: '#/components/parameters/EmployerId'
      responses:
        '201':
          description: Created employee
          content:
            application/json:
              schema:
                type: object
        '422':
          description: Unsupported employment case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/employers/{employer_id}/employees/{id}:
    get:
      x-maturity: implemented
      summary: Show employee detail
      operationId: showEmployee
      parameters:
        - $ref: '#/components/parameters/EmployerId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Employee
          content:
            application/json:
              schema:
                type: object
    patch:
      x-maturity: implemented
      summary: Update employee status
      operationId: updateEmployee
      parameters:
        - $ref: '#/components/parameters/EmployerId'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, suspended, resigned, terminated]
                reason:
                  type: string
                effective:
                  type: string
                  format: date
      responses:
        '200':
          description: Updated employee
          content:
            application/json:
              schema:
                type: object
  /api/v1/employers/{employer_id}/employees/{id}/terms:
    get:
      x-maturity: implemented
      summary: Effective-dated employment terms history
      operationId: listTerms
      parameters:
        - $ref: '#/components/parameters/EmployerId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Terms history
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      x-maturity: implemented
      summary: Add new effective-dated terms
      operationId: addTerms
      parameters:
        - $ref: '#/components/parameters/EmployerId'
        - $ref: '#/components/parameters/Id'
      responses:
        '201':
          description: Created terms
          content:
            application/json:
              schema:
                type: object
  /api/v1/employers/{employer_id}/employees/{id}/terms/{terms_id}/compensation:
    get:
      x-maturity: implemented
      summary: List compensation lines under one terms row
      operationId: listCompensation
      parameters:
        - $ref: '#/components/parameters/EmployerId'
        - $ref: '#/components/parameters/Id'
        - name: terms_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Compensation lines
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      x-maturity: implemented
      summary: Add a compensation line to one terms row
      operationId: addCompensation
      parameters:
        - $ref: '#/components/parameters/EmployerId'
        - $ref: '#/components/parameters/Id'
        - name: terms_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, code, amount_monthly, effective_from, reason]
              properties:
                kind:
                  type: string
                code:
                  type: string
                amount_monthly:
                  type: string
                effective_from:
                  type: string
                effective_to:
                  type: string
                reason:
                  type: string
      responses:
        '201':
          description: Created compensation line
          content:
            application/json:
              schema:
                type: object
  /api/v1/employers/{employer_id}/employees/{id}/terms/{terms_id}/compensation/{line_id}/corrections:
    post:
      x-maturity: implemented
      summary: Correct a compensation line, minting an audited successor
      operationId: correctCompensation
      parameters:
        - $ref: '#/components/parameters/EmployerId'
        - $ref: '#/components/parameters/Id'
        - name: terms_id
          in: path
          required: true
          schema:
            type: string
        - name: line_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_monthly, effective_from, reason]
              properties:
                amount_monthly:
                  type: string
                effective_from:
                  type: string
                effective_to:
                  type: string
                reason:
                  type: string
      responses:
        '201':
          description: Created compensation successor
          content:
            application/json:
              schema:
                type: object
  /api/v1/employers/{employer_id}/employees/{id}/shg:
    get:
      x-maturity: implemented
      summary: List SHG instructions for an employee
      operationId: listShg
      parameters:
        - $ref: '#/components/parameters/EmployerId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: SHG instructions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      x-maturity: implemented
      summary: Record an SHG instruction
      operationId: setShg
      parameters:
        - $ref: '#/components/parameters/EmployerId'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fund, status, source_declaration, effective_from]
              properties:
                fund:
                  type: string
                status:
                  type: string
                source_declaration:
                  type: string
                effective_from:
                  type: string
      responses:
        '201':
          description: Created SHG instruction
          content:
            application/json:
              schema:
                type: object
  /api/v1/employers/{employer_id}/employees/{id}/ket:
    get:
      x-maturity: draft
      summary: KET snapshots for an employee
      operationId: listKet
      parameters:
        - $ref: '#/components/parameters/EmployerId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: KET snapshots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Paginated'
  /api/v1/employers/{employer_id}/clients:
    get:
      x-maturity: implemented
      summary: List clients
      operationId: listClients
      parameters:
        - $ref: '#/components/parameters/EmployerId'
      responses:
        '200':
          description: Clients
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      x-maturity: implemented
      summary: Create a client
      operationId: createClient
      parameters:
        - $ref: '#/components/parameters/EmployerId'
      responses:
        '201':
          description: Created client
          content:
            application/json:
              schema:
                type: object
  /api/v1/employers/{employer_id}/programmes:
    get:
      x-maturity: implemented
      summary: List programmes
      operationId: listProgrammes
      parameters:
        - $ref: '#/components/parameters/EmployerId'
      responses:
        '200':
          description: Programmes
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      x-maturity: implemented
      summary: Create a programme
      operationId: createProgramme
      parameters:
        - $ref: '#/components/parameters/EmployerId'
      responses:
        '201':
          description: Created programme
          content:
            application/json:
              schema:
                type: object
  /api/v1/employers/{employer_id}/programmes/{id}/require-skills:
    post:
      x-maturity: implemented
      summary: Set required programme skills
      operationId: requireProgrammeSkills
      parameters:
        - $ref: '#/components/parameters/EmployerId'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
      responses:
        '200':
          description: Required skills set
          content:
            application/json:
              schema:
                type: object
  /api/v1/employers/{employer_id}/teams:
    get:
      x-maturity: implemented
      summary: List teams and memberships
      operationId: listTeams
      parameters:
        - $ref: '#/components/parameters/EmployerId'
      responses:
        '200':
          description: Teams
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      x-maturity: implemented
      summary: Create a team
      operationId: createTeam
      parameters:
        - $ref: '#/components/parameters/EmployerId'
      responses:
        '201':
          description: Created team
          content:
            application/json:
              schema:
                type: object
  /api/v1/employers/{employer_id}/teams/{id}/members:
    post:
      x-maturity: implemented
      summary: Add an employee to a team
      operationId: addTeamMember
      parameters:
        - $ref: '#/components/parameters/EmployerId'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employee, role, effective_from]
              properties:
                employee:
                  type: string
                role:
                  type: string
                  enum: [agent, lead, supervisor]
                effective_from:
                  type: string
                  format: date
      responses:
        '201':
          description: Created team membership
          content:
            application/json:
              schema:
                type: object
  /api/v1/employers/{employer_id}/skills:
    post:
      x-maturity: implemented
      summary: Assign a skill to an employee
      operationId: assignSkill
      parameters:
        - $ref: '#/components/parameters/EmployerId'
      responses:
        '201':
          description: Created skill assignment
          content:
            application/json:
              schema:
                type: object
  /api/v1/employers/{employer_id}/shift-templates:
    get:
      x-maturity: implemented
      summary: List shift templates with segments
      operationId: listShiftTemplates
      parameters:
        - $ref: '#/components/parameters/EmployerId'
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      x-maturity: implemented
      summary: Create a shift template
      operationId: createShiftTemplate
      parameters:
        - $ref: '#/components/parameters/EmployerId'
      responses:
        '201':
          description: Created template
          content:
            application/json:
              schema:
                type: object
  /api/v1/employers/{employer_id}/rotations:
    post:
      x-maturity: implemented
      summary: Assign a rotation pattern to an employee or team
      operationId: assignRotation
      parameters:
        - $ref: '#/components/parameters/EmployerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pattern, effective_from]
              properties:
                pattern:
                  type: string
                employee:
                  type: string
                team:
                  type: string
                effective_from:
                  type: string
                  format: date
      responses:
        '201':
          description: Created rotation assignment
          content:
            application/json:
              schema:
                type: object
    get:
      x-maturity: implemented
      summary: List rotation assignments
      operationId: listRotations
      parameters:
        - $ref: '#/components/parameters/EmployerId'
      responses:
        '200':
          description: Rotation assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /api/v1/employers/{employer_id}/rosters:
    get:
      x-maturity: implemented
      summary: List rosters
      operationId: listRosters
      parameters:
        - $ref: '#/components/parameters/EmployerId'
      responses:
        '200':
          description: Rosters
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      x-maturity: implemented
      summary: Create a draft roster
      operationId: createRoster
      parameters:
        - $ref: '#/components/parameters/EmployerId'
      responses:
        '201':
          description: Created roster
          content:
            application/json:
              schema:
                type: object
  /api/v1/employers/{employer_id}/rosters/{id}:
    get:
      x-maturity: implemented
      summary: Show a roster with current assignments
      operationId: showRoster
      parameters:
        - $ref: '#/components/parameters/EmployerId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Roster detail
          content:
            application/json:
              schema:
                type: object
  /api/v1/employers/{employer_id}/rosters/{id}/assignments:
    post:
      x-maturity: implemented
      summary: Assign an employee to a roster day
      operationId: assignRoster
      parameters:
        - $ref: '#/components/parameters/EmployerId'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employee, date]
              properties:
                employee:
                  type: string
                date:
                  type: string
                  format: date
                template:
                  type: string
                rest_day:
                  type: boolean
      responses:
        '201':
          description: Created roster assignment
          content:
            application/json:
              schema:
                type: object
  /api/v1/employers/{employer_id}/rosters/{id}/publish:
    post:
      x-maturity: implemented
      summary: Publish a roster (validated, new immutable revision)
      operationId: publishRoster
      parameters:
        - $ref: '#/components/parameters/EmployerId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Published roster
          content:
            application/json:
              schema:
                type: object
  /api/v1/employers/{employer_id}/rosters/{id}/revise:
    post:
      x-maturity: implemented
      summary: Open a new draft revision of a published roster
      operationId: reviseRoster
      parameters:
        - $ref: '#/components/parameters/EmployerId'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Revised roster
          content:
            application/json:
              schema:
                type: object
  /api/v1/employers/{employer_id}/clock-events:
    post:
      x-maturity: implemented
      summary: Import clock events (idempotent by source event ID)
      operationId: importClockEvents
      parameters:
        - $ref: '#/components/parameters/EmployerId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV clock import per API/CLI contract section 7
      responses:
        '200':
          description: Import report (inserted, duplicates, quarantined)
          content:
            application/json:
              schema:
                type: object
  /api/v1/employers/{employer_id}/attendance:
    get:
      x-maturity: implemented
      summary: Inspect interpreted attendance over intervals
      operationId: listAttendance
      parameters:
        - $ref: '#/components/parameters/EmployerId'
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Attendance records
          content:
            application/json:
              schema:
                type: object
  /api/v1/employers/{employer_id}/attendance/intervals:
    get:
      x-maturity: implemented
      summary: List intervals with lineage, linked sheets and exceptions
      operationId: listIntervals
      parameters:
        - $ref: '#/components/parameters/EmployerId'
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: employee
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Interval details
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /api/v1/employers/{employer_id}/attendance/corrections:
    post:
      x-maturity: implemented
      summary: Append an audited attendance correction for one interval or a whole correction group
      operationId: correctAttendance
      parameters:
        - $ref: '#/components/parameters/EmployerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [interval_ids, start, end, kind, reason]
              properties:
                interval_ids:
                  type: array
                  items:
                    type: string
                start:
                  type: string
                end:
                  type: string
                kind:
                  type: string
                reason:
                  type: string
      responses:
        '201':
          description: Created correction
          content:
            application/json:
              schema:
                type: object
  /api/v1/employers/{employer_id}/attendance/events/{event_id}/disposition:
    post:
      x-maturity: implemented
      summary: Confirm a clock event as a duplicate delivery
      operationId: dispositionDuplicateEvent
      parameters:
        - $ref: '#/components/parameters/EmployerId'
        - name: event_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Recorded duplicate disposition
          content:
            application/json:
              schema:
                type: object
  /api/v1/employers/{employer_id}/attendance/attach:
    post:
      x-maturity: implemented
      summary: Attach held late evidence after reissue
      operationId: attachPendingEvidence
      parameters:
        - $ref: '#/components/parameters/EmployerId'
      responses:
        '200':
          description: Attach report
          content:
            application/json:
              schema:
                type: object
  /api/v1/employers/{employer_id}/leave-requests:
    get:
      x-maturity: draft
      summary: List leave requests
      operationId: listLeaveRequests
      parameters:
        - $ref: '#/components/parameters/EmployerId'
      responses:
        '200':
          description: Paginated leave requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Paginated'
    post:
      x-maturity: draft
      summary: Request leave
      operationId: requestLeave
      parameters:
        - $ref: '#/components/parameters/EmployerId'
      responses:
        '201':
          description: Created leave request
          content:
            application/json:
              schema:
                type: object
  /api/v1/employers/{employer_id}/leave-requests/{id}/approve:
    post:
      x-maturity: draft
      summary: Approve or reject a leave request
      operationId: decideLeave
      parameters:
        - $ref: '#/components/parameters/EmployerId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Decided leave request
          content:
            application/json:
              schema:
                type: object
  /api/v1/employers/{employer_id}/timesheets:
    get:
      x-maturity: implemented
      summary: List timesheets
      operationId: listTimesheets
      parameters:
        - $ref: '#/components/parameters/EmployerId'
        - name: period
          in: query
          schema:
            type: string
        - name: employee
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Timesheets
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /api/v1/employers/{employer_id}/timesheets/generate:
    post:
      x-maturity: implemented
      summary: Generate draft timesheets for a pay period
      operationId: generateTimesheets
      parameters:
        - $ref: '#/components/parameters/EmployerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pay_period]
              properties:
                pay_period:
                  type: string
      responses:
        '200':
          description: Generation report with created sheet IDs and skips
          content:
            application/json:
              schema:
                type: object
  /api/v1/employers/{employer_id}/timesheets/{id}:
    get:
      x-maturity: implemented
      summary: Show a timesheet with lines and source intervals
      operationId: showTimesheet
      parameters:
        - $ref: '#/components/parameters/EmployerId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Timesheet detail
          content:
            application/json:
              schema:
                type: object
  /api/v1/employers/{employer_id}/timesheets/{id}/approve:
    post:
      x-maturity: implemented
      summary: Approve a submitted timesheet
      operationId: approveTimesheet
      parameters:
        - $ref: '#/components/parameters/EmployerId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Approved timesheet
          content:
            application/json:
              schema:
                type: object
  /api/v1/employers/{employer_id}/timesheets/{id}/submit:
    post:
      x-maturity: implemented
      summary: Submit a draft timesheet
      operationId: submitTimesheet
      parameters:
        - $ref: '#/components/parameters/EmployerId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Submitted timesheet
          content:
            application/json:
              schema:
                type: object
  /api/v1/employers/{employer_id}/timesheets/{id}/reject:
    post:
      x-maturity: implemented
      summary: Reject a submitted timesheet
      operationId: rejectTimesheet
      parameters:
        - $ref: '#/components/parameters/EmployerId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Rejected timesheet
          content:
            application/json:
              schema:
                type: object
