# =============================================================================
# Local PostgreSQL for WorkforceOps Lab development.
# Start:   docker compose up -d
# Stop:    docker compose down
# Reset:   docker compose down -v && docker compose up -d
# Default URL (see .env.example):
#   postgresql://a1:a1@localhost:5432/a1
# Role bootstrap runs once at first init via scripts/db/init-roles.sh.
# =============================================================================

name: a1

services:
  postgres:
    image: postgres:16-alpine
    container_name: a1-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-a1}
      POSTGRES_USER: ${POSTGRES_USER:-a1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      A1_DEV_ROLE_PASSWORD: ${A1_DEV_ROLE_PASSWORD:-a1-dev-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - a1-pgdata:/var/lib/postgresql/data
      - ./scripts/db/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-a1}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  a1-pgdata:
